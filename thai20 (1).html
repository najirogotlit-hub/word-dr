<html lang="th">
<head>
<meta charset="utf-8">

<title>ร้อยคำ เกมไพ่คำไทย</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%238e1424%22/%3E%3Cpath%20d%3D%22M32%206c10%2012%2018%2018%2018%2032a18%2018%200%200%201-36%200c0-14%208-20%2018-32z%22%20fill%3D%22%23f0c45a%22/%3E%3Ctext%20x%3D%2232%22%20y%3D%2248%22%20font-size%3D%2228%22%20font-weight%3D%22700%22%20text-anchor%3D%22middle%22%20fill%3D%22%235a0a14%22%20font-family%3D%22sans-serif%22%3E%E0%B8%81%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap">
<style>
:root{--night:#25040a;--grape:#8e1424;--lilac:#d9a845;--paper:#fffdf6;--ink:#241a4d;--coral:#ff4f7b;--sun:#ffc83d;--mint:#27d3a2;
--disp:Prompt,"Noto Sans Thai",sans-serif;--cw:62px}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{background:var(--night)}
body{min-height:100vh;min-height:100dvh;background:radial-gradient(120% 80% at 50% 35%,#7d1020 0,#4c0913 45%,var(--night) 100%) fixed;color:#fff;font-family:var(--disp);line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation;user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.btn{background:#fff;color:var(--ink);border-radius:99px;padding:9px 20px;font-weight:500;box-shadow:0 4px 0 #00000040;transition:transform .12s,box-shadow .12s,filter .12s}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #00000040}
.btn.hot{background:var(--coral);color:#fff}
.btn.big{font-size:21px;padding:13px 44px}
.btn.ghost{background:#ffffff1f;color:#fff;box-shadow:none}
.icon{width:42px;height:42px;border-radius:50%;background:#ffffff1f;font-size:18px;flex:none;transition:background .15s,transform .12s}
.icon:hover{background:#ffffff38}.icon:active{transform:scale(.9)}

.card{--c:#3d6bf0;width:var(--cw);aspect-ratio:5/7;border-radius:calc(var(--cw)*.18);background:var(--c);border:3px solid var(--paper);color:#fff;font-family:var(--disp);font-weight:700;font-size:calc(var(--cw)*.56);display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;flex:none;box-shadow:0 6px 14px #16020455,inset 0 0 0 2px #ffffff30;line-height:1;text-shadow:0 3px 0 #0003}
.card small{font-size:calc(var(--cw)*.17);margin-top:4px}
.card em{position:absolute;top:-8px;right:-8px;min-width:28px;height:28px;border-radius:99px;background:var(--sun);color:var(--ink);border:2px solid var(--paper);font-style:normal;font-size:15px;display:grid;place-items:center;text-shadow:none}
.card.STOP{--c:#ee3e55}.card.REVERSE{--c:#12a574}.card.SWAP{--c:#8b46d9}.card.LIST{--c:#f4801f}
.card.HINT{--c:#0f8fa8}
.card.JOKER{background:conic-gradient(from 210deg,#ff4f7b,#f4801f,#12a574,#3d6bf0,#8b46d9,#ff4f7b)}
.card.back{background:repeating-linear-gradient(45deg,#25040a 0 7px,#5a0b17 7px 14px);font-size:calc(var(--cw)*.34)}
.card.empty{background:none;border:2px dashed #ffffff55;box-shadow:none;font-size:13px;font-family:inherit;text-shadow:none}

#home{max-width:520px;margin:0 auto;padding:26px 16px 40px;text-align:center}
h1{font-size:42px;font-weight:600;line-height:1.35;text-shadow:0 4px 0 #0004}
.tag{color:var(--lilac);margin-bottom:20px}
.sheet{background:var(--paper);color:var(--ink);border-radius:26px;padding:18px;text-align:left;margin-bottom:18px;box-shadow:0 16px 40px #16020466}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.line>b{font-weight:500}
.seg{display:flex;background:#f6e4bd;border-radius:99px;padding:3px}
.seg button{border-radius:99px;padding:5px 12px;font-size:14px;transition:background .18s,color .18s}
.seg button[aria-pressed="true"]{background:var(--grape);color:#fff}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:36px;height:36px;border-radius:50%;background:#f6e4bd;font-size:20px}
.stepper output{font-family:var(--disp);font-size:24px;min-width:20px;text-align:center;font-weight:700}
.seat{display:flex;gap:8px;margin-bottom:8px}
.seat input{flex:1;min-width:0;border:2px solid #e8ca85;border-radius:14px;padding:7px 12px;background:#fff}
.seat button{width:104px;border-radius:14px;background:#f6e4bd;font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px;align-items:center}

#game{max-width:760px;margin:0 auto;height:100vh;height:100dvh;min-height:560px;display:flex;flex-direction:column;padding:10px 10px 0}
.bar{display:flex;align-items:center;gap:8px}
.bar .dir{flex:1;text-align:center;font-size:14px;color:var(--lilac)}
#opps{display:flex;gap:8px;overflow-x:auto;padding:12px 4px 6px;flex:none;scrollbar-width:none}
#opps>:first-child{margin-left:auto}#opps>:last-child{margin-right:auto}
.opp{flex:none;min-width:86px;max-width:130px;text-align:center;border-radius:18px;padding:6px 10px;background:#ffffff17;transition:background .25s,transform .25s,box-shadow .25s;font-size:13px}
.opp span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.opp b{font-family:var(--disp);font-size:22px;font-weight:700}
.opp.on{background:#fff;color:var(--ink);transform:translateY(-4px);box-shadow:0 0 0 3px var(--sun),0 8px 22px #0005}
.opp.low b{color:var(--coral)}
#table{flex:1 0 auto;padding-bottom:8px;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.piles{display:flex;align-items:center;gap:clamp(10px,4vw,34px)}
#cat{width:158px;height:176px;border-radius:26px;background:#ee3e55;border:5px solid var(--paper);box-shadow:0 16px 34px #16020477;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6px}
#cat i{font-style:normal;font-size:50px;line-height:1.2}
#cat strong{font-family:var(--disp);font-weight:700;font-size:22px;line-height:1.1;text-shadow:0 3px 0 #0003}
#cat span{font-size:14px;margin-top:3px}
.pile{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--lilac)}
#say{min-height:56px;max-width:94%;text-align:center;background:#fff;color:var(--ink);border-radius:20px;padding:6px 20px;display:flex;flex-direction:column;justify-content:center}
#say b{font-family:var(--disp);font-weight:700;font-size:26px;color:var(--grape);line-height:1.15;overflow-wrap:anywhere}
#say small{font-size:13px}

#dock{flex:none;background:#1c0407cc;border-radius:28px 28px 0 0;padding:10px 10px max(12px,env(safe-area-inset-bottom));margin:0 -4px;border-top:2px solid #ffffff26}
.status{display:flex;align-items:center;gap:10px;margin:0 6px}
.status b{font-weight:500;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#secs{font-family:var(--disp);font-size:22px;min-width:34px;text-align:right;font-weight:700}
.track{height:8px;background:#ffffff22;border-radius:9px;margin:5px 6px 0;overflow:hidden}
#fill{height:100%;background:var(--mint);transform-origin:left;transition:transform .12s linear,background .3s}
.low #fill{background:var(--coral)}.low #secs{color:var(--coral)}
#hand{display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:7px;padding:16px 4px 8px;min-height:calc(var(--cw)*1.4 + 24px);max-height:34dvh;overflow-y:auto}
#hand.many{--cw:44px;max-height:30dvh}
#hand .card{transition:transform .18s cubic-bezier(.2,1.5,.4,1),box-shadow .18s,filter .2s}
#hand button.card:hover{transform:translateY(-5px)}
#hand button.card.sel{transform:translateY(-11px);box-shadow:0 0 0 3px var(--sun),0 14px 20px #0007}
#hand .card:disabled{cursor:default}
#hand.wait .card{filter:saturate(.6) brightness(.8)}
.hidden-hand{align-self:center;color:var(--lilac)}
#controls{max-width:480px;margin:0 auto}
#form{display:flex;gap:8px}
#word{flex:1;min-width:0;border:0;border-radius:99px;background:#fff;color:var(--ink);padding:10px 18px;font-size:18px}
#word:disabled{background:#ffffff80}
#form .btn{flex:none}
#err{min-height:24px;text-align:center;font-size:14px;color:#ffd3dd;padding:2px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.under{text-align:center}

#over{position:fixed;inset:0;z-index:20;display:flex;padding:18px;background:#1c0407cc;overflow:auto;animation:fade .2s}
#over.solid{background:var(--night)}
@keyframes fade{from{opacity:0}}
.box{margin:auto;width:100%;max-width:440px;background:var(--paper);color:var(--ink);border-radius:28px;padding:22px;text-align:center;box-shadow:0 20px 60px #0008;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) translateY(20px)}}
.box h2{font-weight:600;font-size:22px;margin-bottom:8px;overflow-wrap:anywhere}
.box .btn{border:2px solid #e8ca85}.box .btn.hot{border-color:var(--coral)}
.choices{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.pickcat{width:116px;min-height:140px;border-radius:20px;background:#ee3e55;color:#fff;padding:8px;line-height:1.25;transition:transform .15s}
.pickcat:hover{transform:translateY(-6px) rotate(-2deg)}
.pickcat i{display:block;font-style:normal;font-size:38px}.pickcat b{font-family:var(--disp);font-weight:700;display:block}.pickcat small{font-size:12px}
.box ul{text-align:left;padding-left:20px;font-size:14px;margin-top:8px}
.box .log{list-style:none;padding:0;max-height:45vh;overflow:auto}
.box .log li{padding:5px 0;border-bottom:1px solid #f2dfb4}
.rank{display:flex;justify-content:space-between;padding:6px 14px;border-radius:12px;background:#f6e4bd;margin-top:6px}
.fly{position:fixed;z-index:15;pointer-events:none;margin:0}
.confetti{position:fixed;top:-20px;width:9px;height:16px;border-radius:3px;z-index:30;pointer-events:none}

.art{width:1em;height:1em;display:block;fill:none;stroke:#241a4d;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.card .art{font-size:calc(var(--cw)*.66);filter:drop-shadow(0 3px 0 #0003)}
.card{box-shadow:0 2px 0 #fff8 inset,0 4px 0 #1c040755,0 12px 22px #16020466;overflow:visible}
.card::after{content:"";position:absolute;inset:3px 3px 52% 3px;border-radius:calc(var(--cw)*.12) calc(var(--cw)*.12) 50% 50%;background:linear-gradient(#ffffff38,#ffffff08);pointer-events:none}
.card.empty::after{display:none}
.card em{z-index:1;box-shadow:0 3px 8px #0006;animation:wobble 2.4s ease-in-out infinite}
@keyframes wobble{0%,70%,100%{transform:rotate(0)}76%{transform:rotate(-16deg) scale(1.12)}84%{transform:rotate(12deg) scale(1.12)}92%{transform:rotate(-5deg)}}
.icon{display:grid;place-items:center;box-shadow:0 4px 0 #16020455,0 8px 16px #16020444;background:#fff;font-size:26px}
.icon:hover{background:#fff4cf}.icon:active{transform:translateY(3px) scale(.95);box-shadow:0 1px 0 #16020455}
.btn{box-shadow:0 4px 0 #16020455,0 10px 20px #16020440}
.btn.hot{position:relative;overflow:hidden}
.btn.hot:not(:disabled)::after{content:"";position:absolute;top:0;bottom:0;width:34%;left:-60%;background:linear-gradient(100deg,#fff0,#ffffff66,#fff0);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{55%,100%{left:140%}}
.sheet{box-shadow:0 6px 0 #d9a845,0 22px 44px #16020488}
.opp{box-shadow:0 5px 14px #16020455,inset 0 1px 0 #ffffff33}
.opp .art{font-size:38px;margin:0 auto -2px}
.opp.on{box-shadow:0 0 0 3px var(--sun),0 12px 26px #0008}
.opp.on .art{animation:bounce 1s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-4px) rotate(5deg)}}
#cat{box-shadow:0 8px 0 #a91f38,0 24px 40px #160204aa;position:relative}
#cat::before{content:"";position:absolute;inset:-14px;border-radius:36px;border:3px dashed #ffc83d99;animation:breathe 2.6s ease-in-out infinite;pointer-events:none}
@keyframes breathe{50%{transform:scale(1.045);opacity:.45}}
#cat .art{font-size:68px;margin-bottom:4px}
.draw .art{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both}

.pile .card{filter:drop-shadow(0 6px 4px #16020466)}
#say{position:relative;z-index:1;box-shadow:0 5px 0 #d9a845,0 14px 26px #16020466}
#dock{box-shadow:0 -12px 34px #16020488}
#word{box-shadow:inset 0 3px 6px #25040a33,0 4px 12px #16020455}
.pickcat{box-shadow:0 6px 0 #a91f38,0 14px 24px #16020455;animation:pop .45s cubic-bezier(.2,1.5,.4,1) both}
.pickcat:nth-child(2){animation-delay:.08s}.pickcat:nth-child(3){animation-delay:.16s}
.pickcat .art{font-size:56px;margin:0 auto 4px}
.rank{animation:pop .4s cubic-bezier(.2,1.4,.4,1) both;align-items:center;box-shadow:0 3px 0 #d9a845}
.big-art .art{font-size:112px;margin:0 auto 6px;animation:bounce 1.6s ease-in-out infinite}
.box li .art{display:inline-block;font-size:26px;vertical-align:middle;margin-right:4px}
.seat button{display:flex;align-items:center;justify-content:center;gap:4px}.seat .art{font-size:30px}
.seat input{box-shadow:inset 0 2px 5px #25040a14}
.hero{display:flex;justify-content:center;align-items:flex-end;gap:2px;height:150px;margin-bottom:6px}
.hero .art{font-size:96px;filter:drop-shadow(0 12px 8px #16020477);animation:float 3.4s ease-in-out infinite}
.hero .art:nth-child(2){font-size:140px;animation-delay:-1.2s;z-index:1}.hero .art:nth-child(3){animation-delay:-2.3s}
@keyframes float{50%{transform:translateY(-10px) rotate(3deg)}}
#doodles{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
#doodles .art{position:absolute;stroke:#d9a845;opacity:.28;animation:drift 9s ease-in-out infinite}
@keyframes drift{50%{transform:translate(8px,-18px) rotate(18deg)}}
body{isolation:isolate}

body:has(#game:not([hidden])) #doodles{display:none}
#game{max-width:680px;gap:6px}
.icon{width:40px;height:40px;font-size:24px}
.dir{opacity:.9}
#opps{padding:8px 4px}
.opp{display:grid;grid-template-columns:auto auto;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;min-width:0;padding:6px 14px 6px 8px;line-height:1.25}
.opp .art{grid-row:span 2;font-size:36px;margin:0}
.opp span{max-width:84px}
.opp b{font-size:17px}.opp b+i{display:none}
.opp.on{transform:none}.opp.on .art{animation:bounce .5s ease 2}
#cat::before,.card em,.btn.hot:not(:disabled)::after{animation:none}
#cat::before,.btn.hot::after{display:none}
#say{border:0;cursor:pointer;min-width:180px;font:inherit}
#dock{padding-top:12px}
.status{gap:12px;min-height:38px}
#draw{font-size:14px;padding:6px 16px;box-shadow:none}
#hand{flex-wrap:nowrap;justify-content:safe center;overflow-x:auto;overflow-y:hidden;gap:0;padding:20px 8px 12px;max-height:none;scrollbar-width:none;scroll-behavior:smooth}
#hand.many{--cw:56px;max-height:none}
#hand .card em{right:auto;left:-5px;top:-10px}
#hand{margin:0 auto;column-gap:4px;row-gap:12px;align-items:flex-end;min-height:0}
#hand.two{flex-wrap:wrap;align-content:flex-start;max-height:calc(var(--cw)*2.8 + 46px);overflow-y:auto}
#hand.tiny .card small{display:none}#hand.tiny .card .art{font-size:calc(var(--cw)*.76)}
#err{margin-top:8px;min-height:24px;color:var(--lilac)}
#err.bad{color:#ffd3dd;font-weight:500}
@media(max-height:700px){#cat{width:136px;height:142px}#cat strong{font-size:19px}:root{--cw:54px}#hand.many{--cw:46px}#say{min-height:48px}#table{min-height:196px;gap:8px}}
@media(max-height:700px){#game{min-height:540px;padding-top:6px}.icon{width:36px;height:36px;font-size:16px}#opps{padding:8px 4px 2px}.opp{padding:2px 10px;line-height:1.35}.opp b{font-size:18px}.pile{font-size:0;gap:0}#table{min-height:178px;gap:6px;padding-bottom:6px}#cat{height:124px}#say{min-height:42px;padding:2px 16px}#say b{font-size:20px}#say small{font-size:11px;line-height:1.2}#dock{padding-top:6px}#hand{padding:12px 4px 6px;min-height:calc(var(--cw)*1.4 + 18px)}:root{--cw:48px}#hand.many{--cw:42px}#word{padding:6px 16px;font-size:16px}#form .btn{padding:6px 18px}#err{min-height:20px;font-size:12px;padding:0}#draw{padding:5px 18px;font-size:14px}}
.btn:disabled{opacity:.45;cursor:default}
@media(max-width:360px){:root{--cw:52px}#cat{width:134px}}
@media(max-height:700px){.opp .art{display:none}#cat .art{font-size:40px;margin:0}.hero{height:110px}}
@media(max-height:700px){#game{gap:0}#opps{padding:5px 4px}.opp{padding:3px 10px}.opp .art{display:block;font-size:28px}#hand{padding:14px 8px 6px}#err{margin-top:5px;min-height:20px}.status{min-height:32px}#cat .art{font-size:36px}}

.box h3{font-size:16px;font-weight:600;text-align:left;margin-top:14px;color:#8e1424}
.goal{background:#fff0c2;border-radius:14px;padding:8px;font-weight:500}

.steps li::before{content:counter(n);grid-row:span 2;width:32px;height:32px;border-radius:50%;background:#ff4f7b;color:#fff;display:grid;place-items:center;font-weight:700}
.steps b{font-weight:600}.steps span{font-size:13px}
.box ul.specials{list-style:none;padding:0}
.specials li{display:flex;gap:12px;align-items:center;margin-top:8px;font-size:13px;line-height:1.4}.specials b{display:block;font-size:15px}
.box .specials .card{--cw:38px;box-shadow:0 3px 8px #16020433}.box .specials .art{display:block;margin:0;font-size:28px}
.card.PLUS{--c:#e83e8c}
.box.wide{max-width:560px;height:calc(100dvh - 36px);display:flex;flex-direction:column;padding:16px}
.wide .bookbox{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.wide .choices{margin-top:10px}
.tabs{align-self:center}.tabs button{padding:5px 20px}
.cats{display:flex;gap:8px;overflow-x:auto;flex:none;padding:4px 2px 8px}
.cats button{flex:none;width:76px;border-radius:16px;background:#f6e4bd;padding:6px 2px;font-size:11px;line-height:1.3;transition:background .15s,transform .12s}
.cats button:active{transform:scale(.94)}
.cats button[aria-pressed="true"]{background:#ee3e55;color:#fff;box-shadow:0 4px 0 #a91f38}
.cats .art{font-size:34px;margin:0 auto 2px}
#q,#jotword{width:100%;min-width:0;border:2px solid #e8ca85;border-radius:99px;padding:8px 16px;background:#fff;flex:none}
#jot{display:flex;gap:8px}#jot #jotword{flex:1;width:auto}#jot .btn{flex:none}
.only{font-size:14px;display:flex;gap:8px;justify-content:center;align-items:center}
#list{flex:1;min-height:0;overflow-y:auto;text-align:left;overscroll-behavior:contain}
.note{font-size:13px;color:#8a5a28;text-align:center}.note.bad{color:#c4143c;min-height:0}.note.bad:empty{display:none}
.group{display:grid;grid-template-columns:32px 1fr;gap:8px;margin-top:10px}
.group>b{width:32px;height:32px;border-radius:10px;background:#f6e4bd;display:grid;place-items:center}
.group>b.have{background:#3d6bf0;color:#fff}
.group>div{display:flex;flex-wrap:wrap;gap:6px}

%3Cg%20fill%3D%27%23f0c45a%27%20transform%3D%27translate%2830%2042%29%27%3E%3Cpath%20d%3D%27M0-4C7-9%207-17%200-25C-7-17-7-9%200-4Z%27%20transform%3D%27rotate%280%29%27/%3E%3Cpath%20d%3D%27M0-4C7-9%207-17%200-25C-7-17-7-9%200-4Z%27%20transform%3D%27rotate%2890%29%27/%3E%3Cpath%20d%3D%27M0-4C7-9%207-17%200-25C-7-17-7-9%200-4Z%27%20transform%3D%27rotate%28180%29%27/%3E%3Cpath%20d%3D%27M0-4C7-9%207-17%200-25C-7-17-7-9%200-4Z%27%20transform%3D%27rotate%28270%29%27/%3E%3Cpath%20d%3D%27M0-3C3-6%203-9%200-12C-3-9-3-6%200-3Z%27%20transform%3D%27rotate%2845%29%27/%3E%3Cpath%20d%3D%27M0-3C3-6%203-9%200-12C-3-9-3-6%200-3Z%27%20transform%3D%27rotate%28135%29%27/%3E%3Cpath%20d%3D%27M0-3C3-6%203-9%200-12C-3-9-3-6%200-3Z%27%20transform%3D%27rotate%28225%29%27/%3E%3Cpath%20d%3D%27M0-3C3-6%203-9%200-12C-3-9-3-6%200-3Z%27%20transform%3D%27rotate%28315%29%27/%3E%3Ccircle%20r%3D%273.6%27%20fill%3D%27%239c1a28%27/%3E%3C/g%3E%3Cg%20fill%3D%27%23f0c45a%27%3E%3Cpath%20d%3D%27M30%208L34%2014%2030%2020%2026%2014ZM30%2064L34%2070%2030%2076%2026%2070Z%27/%3E%3C/g%3E%3C/svg%3E")}
body,#over.solid,#boot{background:var(--grain),var(--prajam),radial-gradient(80% 52% at 50% 12%,#c8452ccc,#c8452c00 70%),radial-gradient(70% 50% at 104% 78%,#0f5a5299,#0f5a5200 70%),linear-gradient(172deg,#7d1020,#4c0913 55%,#25040a);background-color:#3a070f}
body{background-attachment:fixed}
body::before{content:"";position:fixed;left:0;right:0;top:0;height:9px;background:var(--krajang) center top/16px 10px repeat-x;transform:scaleY(-1);z-index:25;pointer-events:none}
button:focus-visible,input:focus-visible{outline-color:#fff0b8}

/* gable and title */
#home h1.tiles{margin:6px 0 8px}
.gable{width:min(300px,78%);margin:-6px auto -6px;filter:drop-shadow(0 6px 8px #12000288)}
.gable svg{display:block;width:100%;height:auto}
h1.tiles button{width:clamp(46px,13.6vw,64px);aspect-ratio:5/6.4;border-radius:50% 50% 14px 14px/38% 38% 14px 14px;padding:3px;background:linear-gradient(180deg,#fff0b8,#f0c45a 45%,#c48a22 70%,#f6d47a);box-shadow:0 6px 0 #7a4c0c,0 12px 18px #14000288}
h1.tiles button i,.tiles span+span button i{border-radius:inherit;background:var(--grain),linear-gradient(165deg,#c4293a,#97121f 52%,#5e0a16);color:#ffe39a;box-shadow:inset 0 0 0 1.5px #ffe9a8aa;rotate:0deg;font-size:clamp(23px,7vw,34px);padding-top:6px;text-shadow:0 2px 0 #3a0308}
.tiles span+span button{width:clamp(66px,20vw,92px)}
.tiles span+span button i{background:var(--grain),linear-gradient(165deg,#fff3c4,#f4cb60 55%,#d79a2c);color:#8e0f1f;text-shadow:0 1px 0 #fff3c4;box-shadow:inset 0 0 0 1.5px #8e0f1f88}
.boot-tiles{flex-direction:row;gap:16px}
.boot-tiles i,.boot-tiles span+span i{border-radius:50% 50% 14px 14px/38% 38% 14px 14px;border:3px solid #f0c45a;background:var(--grain),linear-gradient(165deg,#c4293a,#97121f 52%,#5e0a16);color:#ffe39a;box-shadow:0 6px 0 #7a4c0c,0 14px 22px #14000288;padding-top:6px}
.boot-tiles span+span i{width:clamp(70px,22vw,98px);background:linear-gradient(165deg,#fff3c4,#f4cb60 55%,#d79a2c);color:#8e0f1f}
.boot-fan s,.boot-fan s:nth-child(n){border:3px solid #f0c45a;border-radius:50% 50% 10px 10px/24% 24% 10px 10px;background:linear-gradient(165deg,#fff8e2,#f4dca0);color:#9c1222;outline:1.5px solid #8a5a14;outline-offset:-8px}
.boot-fan s:nth-child(2){background:var(--grain),linear-gradient(165deg,#c4293a,#97121f 52%,#5e0a16);color:#ffe39a;outline-color:#f0c45a}
.boot-bar i{background:repeating-linear-gradient(115deg,#ffe08a 0 10px,#e2a932 10px 20px)}
.boot-go{color:#5a0a14;background:linear-gradient(180deg,#fff0b8,#f0c45a 45%,#c48a22 70%,#f6d47a);box-shadow:0 6px 0 #7a4c0c,0 14px 28px #14000288;border:2px solid #fff3c4}
.boot-sky b{background:#ffe08a}
.rain i{border:1.5px solid #f0c45a;border-radius:50% 50% 7px 7px/30% 30% 7px 7px;color:#ffe39a;background:linear-gradient(165deg,hsl(var(--h) 55% 34%),hsl(var(--h) 65% 18%))}
.tag{color:#f9e2a6}
#doodles .art.orn{stroke:none;opacity:.34}

/* cards: a pointed arch with a gold double frame */
.card,.warp b,.warp b.gold{border:2.5px solid #f0c45a;border-radius:50% 50% calc(var(--cw)*.14) calc(var(--cw)*.14)/20% 20% calc(var(--cw)*.14) calc(var(--cw)*.14)}
.card::after{inset:3px;border:1.5px solid #f0c45acc;border-radius:inherit;background:none}
.card.L{--flow:linear-gradient(170deg,#fffaf0,#fbe9bb 60%,#efd085);color:#9c1222;text-shadow:0 2px 0 #fff;padding-top:calc(var(--cw)*.08)}
.card.L::after{border-color:#a8761c}
.card.STOP{--c:#a8122a;--flow:linear-gradient(160deg,#d63a40,#a8122a 55%,#5e0a18)}
.card.REVERSE{--c:#0f6b52;--flow:linear-gradient(160deg,#1f9c76,#0f6b52 55%,#073c34)}
.card.SWAP{--c:#5a1f6a;--flow:linear-gradient(160deg,#8a3c9a,#5a1f6a 55%,#2c0c3c)}
.card.LIST{--c:#c2651a;--flow:linear-gradient(160deg,#ee9634,#c2651a 55%,#7a300c)}
.card.HINT{--c:#0f5f78;--flow:linear-gradient(160deg,#218aa0,#0f5f78 55%,#08333f)}
.card.PLUS{--c:#a81c58;--flow:linear-gradient(160deg,#d6407a,#a81c58 55%,#5e0a34)}
.card.JOKER{background:var(--grain),conic-gradient(from 210deg,#c8202f,#e88a2a,#f0c45a,#0f8a66,#2a4a9c,#7a2a7c,#c8202f)}
.card.back{background:var(--medal) center/100% 100% no-repeat,var(--grain),linear-gradient(165deg,#c4293a,#97121f 52%,#5e0a16);background-color:#7a0f1e}
.card.empty{border:2px dashed #f0c45a88;background:none}
.card em{background:linear-gradient(180deg,#fff0b8,#f0c45a 45%,#c48a22 70%,#f6d47a);color:#5a0a14;border-color:#7a4c0c}
.warp b,.warp b.gold{border-radius:50% 50% 8px 8px/22% 22% 8px 8px;color:#9c1222;background:linear-gradient(165deg,#fffaf0,#f4dca0);box-shadow:0 5px 0 #a8761c,0 12px 20px #14000266}
.warp b.gold{color:#ffe39a;background:linear-gradient(165deg,#c4293a,#97121f 52%,#5e0a16)}
.warp u{background:radial-gradient(circle,#fff6d8 0,#ffd97a 26%,#b0202c 48%,#4c0913 70%)}
.warp s{background:repeating-conic-gradient(#fff0 0 5deg,#ffe08a77 6deg,#fff0 7deg 13deg)}

/* the category shrine */
#cat,.pickcat,.firstcard>span,.cats button[aria-pressed="true"],.startcats button[aria-pressed="true"]{background:var(--grain),linear-gradient(165deg,#c4293a,#97121f 52%,#5e0a16);background-color:#97121f}
#cat,.pickcat,.firstcard>span{border:3px solid #f0c45a;border-radius:50% 50% 20px 20px/30% 30% 20px 20px;outline:1.5px solid #f0c45aaa;outline-offset:-8px;box-shadow:0 7px 0 #7a4c0c,0 18px 32px #14000299}
.pickcat{padding-top:20px;color:#fff3cf}
#cat strong{color:#ffe9a8}

/* buttons */
.btn{border:2px solid #d9a845;background:linear-gradient(180deg,#fffaf0,#f8e4b0);color:#6a0d18;box-shadow:0 4px 0 #8a5a14,0 10px 20px #14000240}
.box .btn{border-color:#d9a845}
.btn.hot,.box .btn.hot{background:var(--grain),linear-gradient(165deg,#c4293a,#97121f 52%,#5e0a16);color:#ffeeb8;border-color:#f0c45a;background-color:#97121f}
.box .btn.go,.btn.go{background:var(--grain),linear-gradient(165deg,#1f9c76,#0f6b52 55%,#08463c);background-color:#0f6b52;color:#fff3cf;border-color:#f0c45a}
.btn.ghost{background:#ffffff14;color:#ffe9a8;border-color:#f0c45a77;box-shadow:none}
.icon{border:2px solid #d9a845;background:linear-gradient(180deg,#fffaf0,#f6dfa4)}
#hintbtn{background:linear-gradient(180deg,#fff0b8,#f0c45a 45%,#c48a22 70%,#f6d47a)}
.mirror .frame{border:2px solid #f0c45a;outline:1.5px solid #8a5a14;border-radius:26px}
.switch[aria-checked="true"] i{background:#0f6b52}

/* panels */
.box{background:var(--paper);border:3px solid #d9a845;outline:1.5px solid #d9a845;outline-offset:-8px;box-shadow:0 0 0 5px #5e0a16,0 0 0 7px #f0c45a,0 22px 44px #14000299}
.box h2{color:#8e1424}
.box h2::after{content:"";display:block;width:130px;height:12px;margin:4px auto 0;background:var(--krajang) center bottom/16px 10px repeat-x;filter:drop-shadow(0 1px 0 #8a5a14)}
.wide h2::after{height:10px}
.goal{background:#f8e0a0}
.steps li::before{background:linear-gradient(165deg,#c4293a,#97121f 52%,#5e0a16);color:#ffe9a8;box-shadow:0 0 0 2px #d9a845}
.seg button[aria-pressed="true"],.dtabs button[aria-pressed="true"]{background:linear-gradient(165deg,#c4293a,#97121f 52%,#5e0a16);color:#ffe9a8}
#mean .mcard{background:var(--paper);border:3px solid #d9a845;box-shadow:0 0 0 5px #5e0a16,0 0 0 7px #f0c45a,0 22px 44px #14000299}
#mean .mth{font-size:20px;background:linear-gradient(180deg,#fff0b8,#f0c45a 45%,#c48a22 70%,#f6d47a);box-shadow:0 3px 0 #8a5a14;color:#4a0a10;text-transform:capitalize}
#mean h3{text-transform:none}
.group button,#tray .group button{text-transform:none}
.group h4 b.have{background:linear-gradient(165deg,#c4293a,#97121f 52%,#5e0a16);color:#ffe9a8}

/* home */
.hud .profile,.hud .stat,.hud .gear{background:linear-gradient(180deg,#f0c45a3d,#f0c45a14);border:1.5px solid #f0c45a99}
.stat{color:#ffe08a}
.modes .mode .scene{border:3px solid #f0c45a;border-radius:50% 50% 20px 20px/30% 30% 20px 20px;outline:1.5px solid #ffe9a8aa;outline-offset:-8px;overflow:hidden}
.modes .pill{--hi:#d6404a;--lo:#8e0f1f;--edge:#4c0610;border-color:#f0c45a;color:#fff3cf}
.modes .party .pill{--hi:#1f9c76;--lo:#0b5a46;--edge:#063428}
.modes .online .pill{--hi:#3c62b8;--lo:#1f3274;--edge:#101c46}
.modes .mode .pill{border-color:#f0c45a}
.bank{background:var(--grain),linear-gradient(120deg,#fffaf0 35%,#f8e4b0);border:2px solid #d9a845;outline:1px solid #d9a845;outline-offset:-6px;box-shadow:0 6px 0 #8a5a14,0 14px 28px #14000266}
.dockbar button{border:2px solid #f0c45a}
.dockbar button:first-child,.dockbar button:first-child:hover{background:var(--grain),linear-gradient(150deg,#b8325c,#6a1240);box-shadow:0 6px 0 #4a0a26,0 12px 22px #14000255}
.dockbar button+button,.dockbar button+button:hover{background:var(--grain),linear-gradient(150deg,#14806c,#0b4658);box-shadow:0 6px 0 #062c34,0 12px 22px #14000255}
.dockbar .art{background:#fff6de;box-shadow:0 0 0 2px #d9a845}

/* table */
.opp{background:#5e0a16aa;border:1.5px solid #f0c45a88}
.opp b{color:#ffd96a}
.opp.on{background:var(--paper);border-color:#d9a845;box-shadow:0 0 0 3px var(--sun),0 12px 26px #14000288}
.opp.on b{color:#9c1222}
#say{background:var(--paper);border:2px solid #d9a845;box-shadow:0 4px 0 #8a5a14,0 14px 30px #14000266}
#dock{position:relative;background:var(--grain),var(--prajam),linear-gradient(170deg,#5a0b17f2,#2c050cf5);border-top:2px solid #f0c45a;box-shadow:inset 0 3px 0 #5e0a16,inset 0 4px 0 #f0c45a88,0 -6px 18px #14000266}
.pile{color:#f9e2a6}
#fill{background:linear-gradient(90deg,#e2a932,#ffe08a)}
.low #fill,#dock.fast #fill{background:#ff5a4a}
#clue .tile{flex:0 1 38px;width:auto;line-height:1.5}
.code{border:3px dashed #d9a845;color:#8e1424}
@media(max-height:700px){.gable{width:190px;margin:-12px auto -4px}h1.tiles button{width:44px}.tiles span+span button{width:62px}.box h2::after{display:none}}

</style>
</head>

const TUNE={bpm:88,
/* one string per bar, eight eighth-notes: steps of the seven-tone scale, x is a rest */
lead:["4 5 7 5 4 2 4 5","7 8 9 8 7 5 7 7","9 11 9 8 7 8 5 7","8 7 5 4 2 4 5 4",
"4 5 7 5 4 2 4 5","7 9 11 12 11 9 8 9","11 9 8 7 5 7 8 5","4 5 4 2 0 2 4 4",
"9 x 9 11 12 11 9 11","12 14 12 11 9 11 8 9","7 x 7 8 9 8 7 5","4 5 7 8 7 5 4 5",
"7 5 4 2 4 5 7 9","8 9 11 9 8 7 5 7","9 8 7 5 4 2 4 5","7 5 4 2 4 x 0 0"]};

function strike(c,out,f,t,len,vol,attack=.004,type="sine"){const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g).connect(out);o.start(t);o.stop(t+len+.02)}
/* hard wooden bar: a short bright partial on top of a quick fundamental, doubled an octave below */

/* bossed gong: slower, with partials that do not line up */

/* flute with a gentle vibrato */
function khlui(c,out,d,t,len,v){const o=c.createOscillator(),g=c.createGain(),w=c.createOscillator(),a=c.createGain();o.type="sine";o.frequency.value=pitch(d);w.frequency.value=5.4;a.gain.value=pitch(d)*.008;w.connect(a).connect(o.frequency);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.12);g.gain.setValueAtTime(v,t+len*.7);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g).connect(out);o.start(t);w.start(t);o.stop(t+len+.02);w.stop(t+len+.02)}
